<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>野菜購入（事業者用）</title>

<style>
body {
  font-family: sans-serif;
  font-size: 18px;
  padding: 12px;
  background: #e1dbdb;
}

h1 { font-size: 24px; }

input {
  width: 100%;
  font-size: 18px;
  padding: 8px;
  margin: 6px 0 12px;
  max-width: 10cm;
}

button {
  font-size: 18px;
  padding: 10px;
  border-radius: 6px;
  border: none;
  background: #007700;
  color: #fff;
  cursor: pointer;
}

.card {
  background: #fff;
  border-radius: 10px;
  padding: 12px;
  margin: 12px;
  width: 13cm;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}

#list {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}

#loginArea {
  background:#fff;
  padding:12px;
  border-radius:8px;
  width:12cm;
}
</style>
</head>

<body>

<!-- ログイン -->
<div id="loginArea">
  <h2 id="loginTitle">ログイン / 新規登録</h2>

  <div id="loginForm">
    <input id="email" type="email" placeholder="メールアドレス">
    <input id="password" type="password" placeholder="パスワード">

    <button id="loginBtn">ログイン</button>
    <button id="signupBtn" style="background:#555;margin-top:8px;">
      初めての方はこちら（登録）
    </button>
  </div>

  <div id="loginStatus" style="display:none;">
      <div id="loginUser"></div>
      <button id="logoutBtn" style="background:#aa0000;margin-top:8px;">
        ログアウト
      </button>
  </div>
</div>

<!-- 購入画面 -->
<div id="buyerArea" style="display:none;">
  <h1>本日の野菜（事業者用）</h1>

  <button id="historyBtn">購入履歴を見る</button>

  <label>購入者名（事業者名）</label>
  <input id="buyer_name" placeholder="例：山田青果店">

  <div id="list"></div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://zyvpzobykvuscxuhsrad.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5dnB6b2J5a3Z1c2N4dWhzcmFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3OTE0NTAsImV4cCI6MjA4NTM2NzQ1MH0.Z2cKv3VSlk3iibQl7ldwcff9WF5cBHTZkcrdvxA2Bbk"
);

/* 初期化 */
document.addEventListener("DOMContentLoaded", async () => {
  loginBtn().onclick = login;
  signupBtn().onclick = signup;
  logoutBtn().onclick = logout;
  historyBtn().onclick = () => location.href = "buyer_history.html";
  
  const { data: { user } } = await supabase.auth.getUser();
  if (user) enableBuyer(user.email, user.id);
});
let currentBuyerId = null;//------------------------------------------------------------追加1

/*ログアウト*/
async function logout() {
  await supabase.auth.signOut();

  // 表示を元に戻す
  loginForm().style.display = "block";
  loginStatus().style.display = "none";
  buyerArea().style.display = "none";

  // 入力リセット（任意）
  emailEl().value = "";
  passwordEl().value = "";
}

/* 認証 */
async function login() {
  const { error, data } = await supabase.auth.signInWithPassword({
    email: emailEl().value,
    password: passwordEl().value
  });
  if (error) return alert("ログイン失敗");

  enableBuyer(data.user.email, data.user.id);
}

async function signup() {
  const { error } = await supabase.auth.signUp({
    email: emailEl().value,
    password: passwordEl().value
  });
  if (error) return alert("登録失敗");

  alert("登録完了");
}

/* 表示切替（ログイン画面は残す） */
function enableBuyer(email, userId) {
  currentBuyerId = userId;//----------------------------------------------------------追加2
  loginForm().style.display = "none";
  loginStatus().style.display = "block";
  loginUser().textContent = `ログイン中：${email}`;

  buyerArea().style.display = "block";
  loadVegetables();
}

/* 野菜取得 */
async function loadVegetables() {
  const { data } = await supabase
    .from("vegetables")
    .select("*")
    .eq("is_available", true)
    .order("created_at", { ascending: false });

  list().innerHTML = "";
  data.forEach(v => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <img src="${v.image_url}" style="width:100%">
      <h3>${v.vegetable_name}</h3>
      <div>${v.farm_name}</div>
      <div>${v.price}円 / ${v.unit}</div>
      <input type="number" min="1" value="1" id="qty_${v.id}">
      <button>購入しました</button>
    `;
    div.querySelector("button").onclick = () => purchase(v.id);
    list().appendChild(div);
  });
}

/* 購入 */
async function purchase(id) {
  //if (!buyerName().value) return alert("購入者名必須");

  await supabase.from("purchases").insert({
    vegetable_id: id,
    buyer_name: buyerName().value,
    quantity: document.getElementById(`qty_${id}`).value,
    buyer_id: currentBuyerId//----------------------------------追加4
  });

  await supabase.from("vegetables").update({ is_available:false }).eq("id", id);

  alert("購入完了");
  loadVegetables();
}

/* 短縮 */
const emailEl = () => document.getElementById("email");
const passwordEl = () => document.getElementById("password");
const loginBtn = () => document.getElementById("loginBtn");
const signupBtn = () => document.getElementById("signupBtn");
const historyBtn = () => document.getElementById("historyBtn");
const loginForm = () => document.getElementById("loginForm");
const loginStatus = () => document.getElementById("loginStatus");
const buyerArea = () => document.getElementById("buyerArea");
const list = () => document.getElementById("list");
const buyerName = () => document.getElementById("buyer_name");
const logoutBtn = () => document.getElementById("logoutBtn");
const loginUser = () => document.getElementById("loginUser");
</script>

</body>
</html>
