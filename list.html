<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>販売中の野菜一覧</title>

  <!-- ================================
       CSS（見た目のデザイン設定）
       ================================ -->
  <style>

    /* ページ全体の基本設定 */
    body {
      font-family: sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 12px;
      font-size: 20px;
    }

    /* 見出し */
    h1 {
      font-size: 26px;
      margin-bottom: 16px;
    }

    /* 商品カード */
    .item {
      background: white;
      padding: 16px;
      margin-bottom: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 野菜画像の表示設定 */
    .item img {
      width: 100%;
      height: 180px;          /* 高さ固定 */
      object-fit: contain;    /* 画像を切らずに表示 */
      background-color: #f5f5f5;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    /* 野菜名 */
    .name {
      font-weight: bold;
      font-size: 22px;
      margin-bottom: 6px;
    }

    /* 価格表示 */
    .price {
      color: #444;
      margin: 4px 0;
    }

    /* ボタン共通デザイン */
    button {
      width: 100%;
      font-size: 20px;
      padding: 14px;
      margin-top: 10px;
      background: #752d2a;
      color: white;
      border: none;
      border-radius: 8px;
    }

    /* スマホ小画面対応 */
    @media (max-width: 480px) {
      body {
        font-size: 22px;
    }
      
    h1 {
      font-size: 28px;
    }
    
    .item img {
      height: 260px;
    }  

    button {
      font-size: 22px;
      padding: 16px;
    }
  }

  /* 一覧を2列グリッドに */
    #list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    
  @media (max-width: 480px) {
      #list {
      grid-template-columns: 1fr;
      }
    }      

  </style>
</head>

<body>

  <!-- ================================
       index.htmlへ戻るボタン
       ================================ -->
  <button onclick="location.href='index.html'"
          style="margin-bottom:12px; background:#2d5a75;">
    ← 登録画面へ戻る
  </button>

  <!-- ページタイトル -->
  <h1>販売中の野菜</h1>

  <!-- 野菜一覧表示エリア -->
  <div id="list"></div>


  <!-- ================================
       JavaScript（Supabase連携）
       ================================ -->
  <script type="module">

    /* Supabaseライブラリ読み込み */
    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    /* Supabase接続設定 */
    const supabase = createClient(
      "https://zyvpzobykvuscxuhsrad.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5dnB6b2J5a3Z1c2N4dWhzcmFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3OTE0NTAsImV4cCI6MjA4NTM2NzQ1MH0.Z2cKv3VSlk3iibQl7ldwcff9WF5cBHTZkcrdvxA2Bbk"
    );

    let currentUser = null;


    /* =====================================
       自分の野菜一覧を読み込む関数
       ===================================== */
    async function loadItems() {

      // ① ログインユーザー取得
      const { data: { user }, error: userError } =
        await supabase.auth.getUser();

      // ログインしていない場合
      if (userError || !user) {
        alert("ログインしてください");
        return;
      }

      // ② 自分の farmer_id の野菜だけ取得
      const { data, error } = await supabase
        .from("vegetables")
        .select("*")
        .eq("farmer_id", user.id)     // ログイン中ユーザーのID
        .eq("is_available", true)     // 販売中のみ
        .order("created_at", { ascending: false }); // 新しい順

      if (error) {
        alert("読み込み失敗");
        console.error(error);
        return;
      }

      // 一覧表示エリア取得
      const list = document.getElementById("list");
      list.innerHTML = "";

      // データが無い場合
      if (data.length === 0) {
        list.innerHTML = "<p>現在販売中の野菜はありません</p>";
        return;
      }

      // データを画面に表示
      data.forEach(item => {

        const div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
          ${item.image_url ? `<img src="${item.image_url}">` : ""}
          <div class="name">${item.vegetable_name}</div>
          <div class="price">${item.price}円 / ${item.unit}</div>
          <button onclick="stopSale('${item.id}')">
            販売を中止する
          </button>
        `;

        list.appendChild(div);
      });
    }


    /* =====================================
       販売中止処理
       ===================================== */
    async function stopSale(id) {

      if (!confirm("この野菜を販売中止にしますか？")) return;

      const { error } = await supabase
        .from("vegetables")
        .update({ is_available: false })
        .eq("id", id);

      if (error) {
        alert("更新失敗");
        return;
      }

      loadItems(); // 再読み込み
    }

    /* HTML側から呼べるようにする */
    window.stopSale = stopSale;

    /* ページ読み込み時に一覧取得 */
    loadItems();

  </script>

</body>
</html>
