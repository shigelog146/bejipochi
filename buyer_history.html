<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>購入履歴（事業者用）</title>
<style>
body {
  font-family: sans-serif;
  font-size: 18px;
  padding: 12px;
  background: #e1dbdb;
}

h1 { font-size: 24px; }

#historyList {
  margin-top: 16px;
}

.historyCard {
  background: #fff;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}

</style>
</head>
<body>

<button id="backBtn" style="padding:10px 20px; background:#007700; color:#fff; border:none; border-radius:6px; cursor:pointer; margin-bottom:16px;">
  購入画面に戻る
</button>

<div id="historyList"></div>


<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://zyvpzobykvuscxuhsrad.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5dnB6b2J5a3Z1c2N4dWhzcmFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3OTE0NTAsImV4cCI6MjA4NTM2NzQ1MH0.Z2cKv3VSlk3iibQl7ldwcff9WF5cBHTZkcrdvxA2Bbk"
);

let currentBuyerId = null;

// ページ初期化
document.addEventListener("DOMContentLoaded", async () => {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) {
    alert("ログインしてください");
    location.href = "buyer.html";
    return;
  }

  currentBuyerId = user.id;

  // 購入画面に戻るボタン
  document.getElementById("backBtn").onclick = () => location.href = "buyer.html";

  // 自分の購入履歴をロード
  loadHistory();
});

// 履歴を取得して表示
async function loadHistory() {
  const { data, error } = await supabase
    .from("purchases")
    .select(`
      quantity,
      purchased_at,
      vegetables (
        vegetable_name,
        farm_name,
        unit,
        price
      )
    `)
    .eq("buyer_id", currentBuyerId)
    .order("purchased_at", { ascending: false });

  if (error) return alert("履歴取得に失敗しました");

  const historyList = document.getElementById("historyList");
  historyList.innerHTML = "";

  if (!data || data.length === 0) {
    historyList.textContent = "購入履歴はありません。";
    return;
  }

  data.forEach(p => {
    const div = document.createElement("div");
    div.className = "historyCard";
    div.innerHTML = `
      <div><strong>購入日時：</strong>${new Date(p.purchased_at).toLocaleString()}</div>
      <div><strong>野菜名：</strong>${p.vegetables.vegetable_name}</div>
      <div><strong>農家：</strong>${p.vegetables.farm_name}</div>
      <div><strong>数量：</strong>${p.quantity} ${p.vegetables.unit}</div>
      <div><strong>単価：</strong>${p.vegetables.price}円</div>
      <div><strong>合計：</strong>${p.quantity * p.vegetables.price}円</div>
    `;
    historyList.appendChild(div);
  });
}
</script>

</body>
</html>
